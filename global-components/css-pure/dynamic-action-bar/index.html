<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css"/>
    <title>Selection Feature Page</title>
</head>

<body>

        <form class="feature-form">

            <H1>Feature Selection</H1>

            <div class="feature-card-container">

                <label for="priority-support" class="feature-card">
                    <input id="priority-support" type="checkbox">
                    <h4>Priority Support</h4>
                    <p>Get help faster</p>
                </label>

                <label for="custom-reports" class="feature-card">
                    <input id="custom-reports" type="checkbox">
                    <h4>Custom Reports</h4>
                    <p>Generate reports on demand</p>
                </label>

                <label for="api-access" class="feature-card">
                    <input id="api-access" type="checkbox">
                    <h4>API Access</h4>
                    <p>Integrate with your custom built tools</p>
                </label>

                <label for="dedicated-support" class="feature-card">
                    <input id="dedicated-support" type="checkbox">
                    <h4>Dedicated Support</h4>
                    <p>24/7 customer help</p>
                </label>

                <label for="advanced-analytics" class="feature-card">
                    <input id="advanced-analytics" type="checkbox">
                    <h4>Advanced Analytics</h4>
                    <p>Insights & reports</p>
                </label>

                <label for="custom-user-themes" class="feature-card">
                    <input id="custom-user-themes" type="checkbox">
                    <h4>Custom User Themes</h4>
                    <p>Personalized dashboard design</p>
                </label>

                <label for="multi-user-collab" class="feature-card">
                    <input id="multi-user-collab" type="checkbox">
                    <h4>Multi-User Collab</h4>
                    <p>Team access and sharing</p>
                </label>

                <label for="advanced-analytics" class="feature-card">
                    <input id="advanced-analytics" type="checkbox">
                    <h4>Advanced Analytics</h4>
                    <p>Insights & reports</p>
                </label>

                <label for="api-access" class="feature-card">
                    <input id="api-access" type="checkbox">
                    <h4>API Access</h4>
                    <p>Integrate with your custom built tools</p>
                </label>
            </div>
            
            <div class="action-bar">
                <p>Great choices! You can now proceed to confirm your selected features.</p>
                <button type="submit" class="submit-selection-btn">Confirm & Proceed</button>
            </div>

        </form>

</body>

</html>
